name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5  # Updated to v5 for better caching
        with:
          python-version: '3.11'  # Pin to a stable version (or '3.12')
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # If you don't have requirements.txt yet, fall back to manual:
          # pip install pytest pytest-cov python-dotenv supabase requests

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing