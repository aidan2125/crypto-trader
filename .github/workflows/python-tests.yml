name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Pin to a specific version (recommended)
          cache: 'pip'            # Speeds up runs by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov  # Add cov if you want coverage later
          # Install core testing + project runtime deps
          pip install supabase python-dotenv requests
          # If you have a requirements.txt (highly recommended!), use this instead:
          # pip install -r requirements.txt
          # pip install pytest  # only if not in requirements.txt

      - name: Run tests
        run: |
          pytest -q