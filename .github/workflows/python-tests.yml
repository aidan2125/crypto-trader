name: Python tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
      - name: Run tests
        run: |
          pytest -q

# Notes:
# - This workflow runs unit tests and should NOT contain or expose secrets.
# - If you need to run tests that require external API keys, use a separate
#   workflow that references GitHub Secrets and is protected by a GitHub
#   Environment (see `integration-alerts.yml`). Example usage of a secret
#   inside a workflow step (DO NOT hardcode secrets in the repo):
#
# env:
#   DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
