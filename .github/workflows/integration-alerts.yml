name: Integration - Alerts (manual)

# Manual only. Sends a REAL Discord message using the `alerts` environment secret.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-alert-integration:
    runs-on: ubuntu-latest
    environment: alerts
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Discord integration test (real send)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: .
        run: python scripts/discord_integration_check.py
